<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#fff7ed;color:#2d3436;line-height:1.7;font-size:15px}
#app{max-width:560px;margin:0 auto;padding:14px 12px 80px}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;margin-bottom:12px;color:#e17055}
h3{font-size:15px;margin:18px 0 8px;color:#6c5ce7}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.05);white-space:pre-line}
.card.gold{background:#fff8e7;border:1.5px solid #fdcb6e}
.card.rose{background:#fff0f5;border:1.5px solid #f8c8d8}
.card.mint{background:#eef9f3;border:1.5px solid #b8e0c8}
.card.blue{background:#eef4fc;border:1.5px solid #b8cde8}
.card.secret{border-left:4px solid #e84393;background:#fff5f9}
.card.clue{border-left:4px solid #e17055;background:#fffaf5}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:#fff;color:#2d3436;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.06);margin-top:10px;font-family:inherit}
.btn.primary{background:linear-gradient(135deg,#e17055,#e74c3c);color:#fff}
.btn.gold{background:linear-gradient(135deg,#f39c12,#fdcb6e);color:#fff}

.btn.purple{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff}
.btn.ghost{background:transparent;border:2px solid #e0d5c8;box-shadow:none}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{margin-top:0;flex:1}
.hint{color:#8b9aa8;font-size:13px;margin-bottom:12px}
.input{width:100%;background:#fff;border:2px solid transparent;border-radius:12px;padding:13px;font-size:15px;font-family:inherit;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:12px}
textarea.input{min-height:80px;resize:vertical}
.hero{text-align:center;padding:20px 0 14px}

.pass-name{font-size:26px;font-weight:800;color:#e17055;margin-bottom:14px}
.pass-hint{color:#8b9aa8;font-size:14px;margin-bottom:24px;white-space:pre-line}
.room-code{font-size:40px;font-weight:800;color:#f39c12;letter-spacing:8px;font-family:monospace;text-align:center;margin:10px 0}
.copy-box{background:#fff;border:2px dashed #f39c12;border-radius:12px;padding:12px;font-size:12px;color:#8b9aa8;word-break:break-all;font-family:monospace;margin-bottom:12px}
.host-says{display:flex;gap:10px;padding:13px;background:#fff8e7;border-radius:12px;border-left:4px solid #f39c12;margin-bottom:12px;font-size:14px;color:#7a5c2e;font-style:italic}
.timer-box{text-align:center;padding:22px;background:#fff;border-radius:14px;margin:12px 0}
.timer{font-size:48px;font-weight:200;letter-spacing:4px;color:#e17055;font-variant-numeric:tabular-nums}
.vote-card{display:flex;align-items:center;gap:12px;padding:13px;background:#fff;border:2px solid transparent;border-radius:12px;cursor:pointer;margin-bottom:10px}
.vote-card.selected{border-color:#e17055;background:#fff5f0}
.vote-name{font-size:15px;font-weight:600}
.vote-role{font-size:12px;color:#8b9aa8}
.result-hero{text-align:center;padding:28px 20px;background:linear-gradient(135deg,#fff8e7,#ffe9d6);border-radius:20px;margin-bottom:16px}
.result-emoji{font-size:56px;margin:10px 0}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2d3436;color:#fff;padding:12px 22px;border-radius:100px;font-size:14px;z-index:1000;max-width:90%;text-align:center;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.connection{position:fixed;top:10px;right:10px;font-size:11px;padding:4px 10px;border-radius:12px;background:#fff;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.connection.on{color:#00b894}.connection.off{color:#e17055}.connection.wait{color:#f39c12}
.chat{background:#fff;border-radius:12px;overflow:hidden;margin-top:12px}
.chat-list{height:200px;overflow-y:auto;padding:12px}
.msg{margin-bottom:10px;display:flex;gap:8px}
.msg.me{flex-direction:row-reverse}
.msg.sys{justify-content:center}
.msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;background:#e17055}
.msg-body{max-width:75%}
.msg.me .msg-body{text-align:right}
.msg-name{font-size:11px;color:#8b9aa8}
.msg-bub{display:inline-block;padding:7px 11px;background:#f0ebe3;border-radius:10px;font-size:13px;text-align:left;word-break:break-word}
.msg.me .msg-bub{background:#e17055;color:#fff}
.msg.sys .msg-bub{background:#fff8e7;color:#7a5c2e;font-style:italic;font-size:12px}
.chat-input-bar{display:flex;gap:8px;padding:10px;border-top:1px solid #f0ebe3}
.chat-input{flex:1;background:#fff7ed;border:none;border-radius:8px;padding:10px;font-size:14px;outline:none}
.send-btn{padding:10px 16px;background:#e17055;color:#fff;border-radius:8px;font-size:14px;border:none;font-family:inherit}
.script-card{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:14px;margin-bottom:10px;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.script-card.selected{border-color:#e17055;background:#fffaf5}
.script-emoji{font-size:34px}
.script-info{flex:1}
.script-title{font-size:16px;font-weight:700}
.script-sub{font-size:12px;color:#8b9aa8}
.script-actions{display:flex;gap:6px;margin-top:8px}
.script-actions button{padding:6px 10px;font-size:12px;border:none;border-radius:6px;background:#f0ebe3;color:#5a6b7a;font-family:inherit;cursor:pointer;font-weight:600}
.script-actions button.danger{background:#ffe0e0;color:#e17055}
.editor-sec{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.editor-sec label{display:block;font-size:13px;color:#8b9aa8;margin-bottom:6px;font-weight:600}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #e17055;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<script>

/* ═══════════════════════════════════════════════════════════

var SC1={id:"nianhui",isCustom:false,title:"年会大作战",subtitle:"轻松搞笑 · 悬疑反转",emoji:"🎁",
intro:"2024年12月31日，某互联网公司年会。\n\n大家都在期待特等奖——iPhone 16 Pro Max。\n\n抽奖前10分钟，行政刘姐打开奖品箱——空的！\n\n门没被撬，箱子完好。\n\n6个有嫌疑的人聚在了休息室……",
scene:"年会现场 · 会议室\n- 奖品箱在角落，只有行政和老板有钥匙\n- 下午3点，奖品被刘姐放进箱子\n- 6点30分，发现奖品不见了",
characters:[
{id:1,name:"周凯",role:"实习生",age:22,emoji:"🎓",color:"#6c5ce7",intro:"你是周凯，22岁，实习生。\n\n你女朋友今天生日，你想送她iPhone，但工资不够。\n\n你偷偷量过奖品箱尺寸，想做个同样的木盒。",secret:"【你的秘密】\n\n你下午4点去会议室量了奖品箱尺寸。\n\n你不是想偷，是想做个同样大小的木盒，把礼物放进去给女朋友惊喜。",timeline:"15:00 赶报告\n16:00 去会议室量箱子\n16:15 回工位\n18:30 听说奖品不见了",task:"证明自己只是去量尺寸。"},
{id:2,name:"林主管",role:"销售主管",age:35,emoji:"💼",color:"#0984e3",intro:"你是林主管，35岁。\n\n今年业绩差一点，大客户只认iPhone。\n\n你想过把奖品先给客户看一眼。",secret:"【你的秘密】\n\n你下午5点去看过奖品箱，想确认是不是iPhone。\n\n你没拿，但动过念头。",timeline:"15:00 见客户\n17:00 回公司看箱子\n17:20 回工位\n18:30 听说奖品不见了",task:"解释你去看箱子的真实目的。"},
{id:3,name:"刘姐",role:"行政",age:40,emoji:"👩",color:"#e17055",intro:"你是刘姐，40岁，行政。\n\n你儿子昨晚发烧住院，你今天心不在焉。\n\n你今天拿了好几个盒子进进出出。",secret:"【你的秘密】\n\n下午4:30你拿了一个盒子出会议室，以为是饮料箱。\n\n现在你怀疑自己拿错了。",timeline:"15:00 把iPhone放进奖品箱\n16:30 拿了一个盒子出去\n18:00 回会议室准备抽奖\n18:30 发现箱子空了",task:"说清你下午拿走了什么。"},
{id:4,name:"阿May",role:"前台",age:25,emoji:"💅",color:"#e84393",intro:"你是阿May，25岁，前台。\n\n老板让你留意谁靠近过奖品箱。\n\n你看到了两个身影，但不敢说。",secret:"【你的秘密】\n\n下午4:30看到刘姐拿盒子出来。\n下午5:00看到林主管进会议室。\n\n你只看到影子。",timeline:"16:30 看到刘姐拿盒子\n17:00 看到林主管进会议室\n18:30 和大家发现奖品不见了",task:"说出你看到的两个身影。"},
{id:5,name:"老陈",role:"老员工",age:45,emoji:"🧔",color:"#00b894",intro:"你是老陈，45岁，公司老员工。\n\n你想中奖带老婆去旅游。\n\n下午5:30你偷偷去过会议室。",secret:"【你的秘密】\n\n你只是摸了摸箱子许愿，什么都没拿。",timeline:"15:00 布置会场\n17:30 去会议室摸箱子\n17:35 回会场\n18:30 听说奖品不见了",task:"承认去过会议室，但要说清你什么都没拿。"},
{id:6,name:"小王",role:"老板侄子",age:26,emoji:"🕶",color:"#f39c12",intro:"你是小王，26岁，老板侄子。\n\n你想证明自己不是关系户。\n\n下午4:45，叔叔让你去会议室拿一个盒子。",secret:"【你的秘密】\n\n你拿了桌边看起来比较新的盒子送到叔叔办公室。\n\n现在你怀疑拿错了。",timeline:"16:45 收到叔叔消息\n17:00 去会议室拿了一个盒子\n17:10 送到老板办公室\n18:30 听说奖品不见了",task:"承认你拿了盒子，解释清楚是帮叔叔拿的。"}],
rounds:[
{title:"第一轮 · 案发",publicClues:["奖品箱完好，锁没被撬。","下午3点刘姐把iPhone放进奖品箱。","6点30分刘姐打开箱子，里面是空的。","监控显示有5个人在3点-6点30之间进过会议室：周凯(4:00)、刘姐(4:30)、小王(5:00)、林主管(5:00)、老陈(5:30)。","会议室的角落，有一个比奖品箱稍旧的纸箱（装饮料的）。"],privateClues:{1:["你下午4:00去过会议室。","你手机里有量箱子的照片。"],2:["你下午5:00去过会议室。","你手机里有和客户讨论iPhone的记录。"],3:["你下午4:30拿过一个盒子出去。","你以为是饮料箱，现在不确定了。"],4:["你看到刘姐4:30拿盒子出来。","你看到林主管5:00进会议室。"],5:["你下午5:30摸过箱子。","你对着箱子说过让我中吧。"],6:["你下午5:00拿了一个盒子送到老板办公室。","叔叔让你拿装合同的盒子。"]}},
{title:"第二轮 · 疑点",publicClues:["监控拍到小王下午5:00从会议室出来，手里的盒子大小和奖品箱一样。","刘姐说拿走的盒子应该是饮料箱，但饮料箱还在角落。","老板办公室门锁着，只有老板和小王有钥匙。","老板今天4:30离开公司去机场。"],privateClues:{1:["你量箱子时看到旁边有个旧纸箱，你没动。"],2:["你看了箱子之后离开了，没触碰。"],3:["你开始回想：下午拿的到底是哪个盒子？"],4:["你拍的照片里，小王拿盒子的动作很清楚。"],5:["你想说：我什么都没拿，但怕大家不信。"],6:["你叔叔到现在还没联系你。"]}},
{title:"第三轮 · 真相浮现",publicClues:["老板电话通了：我让小王拿一个装合同的盒子。","小王拿出叔叔发的消息：会议室角落那个新一点的盒子。","刘姐突然想起来：我把奖品箱挪到了桌子旁边！","老板办公室里的盒子打开——是全新的iPhone 16 Pro Max。"],privateClues:{1:["你终于可以放心了。"],2:["你庆幸自己没真动手。"],3:["你想起来：你拿的是饮料箱。"],4:["你把照片拿出来，证明了小王。"],5:["你说出了想中奖的真实原因。"],6:["你向叔叔解释清楚：你拿的是新一点的盒子。"]}}],
truth:{story:"真相是这样的：\n\n下午3点，刘姐把iPhone放进奖品箱，放在会议室角落。\n\n下午4:30，刘姐把奖品箱从角落挪到桌边，拿了旁边的饮料箱出去。\n\n下午4:45，老板给侄子小王发消息：去会议室角落拿一个盒子，装着合同。\n\n下午5点，小王进会议室，看到桌边一个新盒子、角落一个旧盒子。\n\n小王想着老板说新一点的盒子，就拿了桌边那个——奖品箱。\n\n他送到老板办公室就走了。\n\n所以奖品不在会议室，在老板办公室。\n\n【反转】\n每个人今晚都藏着小秘密，但没有人是小偷。\n\n只有一群笨拙又可爱的人。",reasoning:["监控显示小王拿着和奖品箱一样大的盒子。","刘姐把奖品箱挪到了桌边，小王的记忆没错。","老板让小王拿装合同的盒子，但没说是哪个，小王凭新一点判断，拿错了。","刘姐拿走的确实是饮料箱，饮料箱在另一个房间被找到。","周凯、林主管、老陈都没有拿走盒子的动作。"],endings:[{name:"周凯",text:"你把手工木盒送给女朋友，她哭了。"},{name:"林主管",text:"老板把iPhone借给你谈客户，大单谈成了。"},{name:"刘姐",text:"儿子烧退了，老板悄悄给了你奖金。"},{name:"阿May",text:"你的照片帮了大忙，老板升你做行政助理。"},{name:"老陈",text:"你没能中奖，但老婆说带我去吃顿好的就行。"},{name:"小王",text:"你被笑了一个月，叔叔说你就是太急。"}]}};

var SC2={id:"waimai",isCustom:false,title:"外卖大作战",subtitle:"加班夜 · 谁动了小龙虾",emoji:"🦞",
intro:"某互联网公司，晚上8点。\n\n加班的6个人一起点了外卖，其中有一份限量版麻辣小龙虾。\n\n外卖小哥把餐放在前台就走了。\n\n8点30分，大家去前台取餐——\n\n小龙虾的盒子开着，少了大约一半！\n\n其他5份外卖都完好无损。\n\n前台监控恰好在8:00-8:30之间「维修中」。\n\n6个加班的人，谁动了小龙虾？",
scene:"公司前台 · 茶水间\n- 6份外卖放在前台桌上\n- 小龙虾的盒子被打开，少了一半\n- 其他外卖都没被动过\n- 前台监控「维修中」，没有拍到画面\n- 楼层的垃圾桶已经被清运",
characters:[
{id:1,name:"张小胖",role:"程序猿",age:28,emoji:"🐷",color:"#6c5ce7",intro:"你是张小胖，28岁，程序员。\n\n你正在减肥，已经坚持了21天。\n\n今晚加班到很晚，你饿得前胸贴后背。\n\n你点了一份蔬菜沙拉。",secret:"【你的秘密】\n\n你8:15去前台看过外卖，因为饿得受不了想先拿自己的。\n\n你看到小龙虾盒子开着，但你忍住了，什么都没吃。",timeline:"18:00 开始加班\n19:00 和大家一起点外卖\n20:15 去前台看外卖\n20:16 回工位继续改bug\n20:30 和大家一起去取餐",task:"证明你虽然去看过，但没有吃。"},
{id:2,name:"李美丽",role:"产品经理",age:30,emoji:"💄",color:"#e84393",intro:"你是李美丽，30岁，产品经理。\n\n你正在严格控制饮食，只吃沙拉。\n\n你对小龙虾过敏，碰都不能碰。\n\n但你有个习惯：看到什么都想拍照。",secret:"【你的秘密】\n\n你8:20去前台拿自己的沙拉。\n\n你看到小龙虾盒子已经开着，还拍了张照片发朋友圈吐槽「谁这么急」。\n\n你绝对没吃，因为过敏。",timeline:"19:00 点了一份藜麦沙拉\n20:20 去前台拿沙拉\n20:21 拍照发朋友圈\n20:30 和大家一起去取餐",task:"用照片证明你8:20看到盒子就开着了。"},
{id:3,name:"王铁柱",role:"测试工程师",age:32,emoji:"🔧",color:"#0984e3",intro:"你是王铁柱，32岁，测试工程师。\n\n你工作特别认真，今晚一直在工位跑测试。\n\n你的工位离前台最近，只有5米。\n\n你桌上的垃圾桶里有一堆用过的纸巾。",secret:"【你的秘密】\n\n你8:00-8:30一直在工位测试，没离开过。\n\n桌上的纸巾是你8:10擦汗用的，和这场「小龙虾失踪案」没关系。\n\n但你确实听到了前台有动静。",timeline:"18:00 开始跑自动化测试\n20:10 擦汗用了几张纸巾\n20:25 听到前台有声音\n20:30 和大家一起去取餐",task:"用测试日志证明你一直在工位。"},
{id:4,name:"赵小萌",role:"实习生",age:22,emoji:"🌸",color:"#f39c12",intro:"你是赵小萌，22岁，实习生。\n\n你第一天加班，什么都很新鲜。\n\n你8:10去茶水间倒水时，路过前台。\n\n你看到一个穿深色衣服的人影，但没看清是谁。",secret:"【你的秘密】\n\n你8:10看到一个身影在前台附近。\n\n那个人穿着深色衣服，还系着围裙。\n\n你当时没在意，现在回想起来有点可疑。",timeline:"18:00 留下来加班学习\n20:10 去茶水间倒水\n20:10 看到前台有人影\n20:30 和大家一起去取餐",task:"说出你看到的身影特征。"},
{id:5,name:"刘大姐",role:"保洁",age:50,emoji:"🧹",color:"#00b894",intro:"你是刘大姐，50岁，公司保洁。\n\n你每天晚上8点半来公司打扫。\n\n你特别热心，总想着帮助别人。\n\n你今天看到前台有个开着的盒子，以为是吃剩的。",secret:"【你的秘密】\n\n你8:25来公司时看到前台有个开着的餐盒。\n\n你以为是加班的人吃剩不要的，就把它收走放到了楼下的「爱心冰箱」（给流浪者的）。\n\n你觉得自己是在做好事。",timeline:"20:25 到公司开始打扫\n20:26 看到前台开着的餐盒\n20:27 把餐盒放到楼下爱心冰箱\n20:30 继续打扫",task:"说清你把盒子放到了哪里。"},
{id:6,name:"孙经理",role:"部门经理",age:40,emoji:"👔",color:"#e17055",intro:"你是孙经理，40岁，部门经理。\n\n你今晚本来要开视频会，但中途接了个私人电话。\n\n你在前台附近待了大约10分钟。\n\n你的助理说你「有嫌疑」。",secret:"【你的秘密】\n\n你8:15-8:25出去接了个私人电话（是老婆问你什么时候回家）。\n\n你就在前台旁边的楼梯间打电话。\n\n你确实看到了外卖盒，但你没打开过。",timeline:"20:00 开始视频会议\n20:15 出去接私人电话\n20:25 回会议室继续开会\n20:30 和大家一起去取餐",task:"解释你8:15-8:25在哪里、做什么。"}],

{title:"第一轮 · 案发",publicClues:["晚上8点外卖送到，放在前台。","8:30大家去取餐时，发现小龙虾盒子被打开，少了大约一半。","其他5份外卖都完好无损。","前台监控8:00-8:30「维修中」，没有画面。","楼层的垃圾桶已经被清运，找不到小龙虾壳。"],privateClues:{1:["你8:15去前台看过外卖。","你看到小龙虾盒子已经开着了。"],2:["你8:20去拿过沙拉。","你拍了照片，照片时间戳显示盒子开着。"],3:["你8:00-8:30一直在工位。","你桌上的纸巾是8:10擦汗用的。"],4:["你8:10路过前台。","你看到一个穿深色衣服、系围裙的人影。"],5:["你8:25到公司打扫。","你收走了一个开着的餐盒。"],6:["你8:15-8:25在前台旁楼梯间接电话。","你看到外卖盒，但没碰。"]}},
{title:"第二轮 · 疑点",publicClues:["李美丽的朋友圈照片显示，小龙虾盒子在8:20就已经开着。","刘大姐说她收走的「剩菜」放到楼下爱心冰箱了。","爱心冰箱的志愿者说，8:40左右有一盒小龙虾被取走。","赵小萌看到的人影穿着深色衣服，系着围裙。","孙经理的会议记录显示他8:15-8:25不在线。"],privateClues:{1:["你8:15看到的盒子已经开着，说明8:15前就有人打开过。"],2:["你的照片里，盒子旁边放着一双筷子——你没在意，现在想想不对劲。"],3:["你桌上的纸巾确实是擦汗的，但你听到前台有塑料摩擦的声音。"],4:["你回想那个人影，好像系的是白色围裙。"],5:["你突然想起来：你收走的时候盒子好像挺满的，不像剩菜。"],6:["你承认8:15-8:25在楼梯间，但你没碰过外卖。"]}},
{title:"第三轮 · 真相浮现",publicClues:["调取8:00-8:30的电梯监控：外卖小哥8:10又回来过一次。","外卖小哥承认：他送错了一份「加辣」的小龙虾，回来换。","刘大姐确认：她把开着的餐盒放到了爱心冰箱。","爱心冰箱志愿者：8:40有人取走了一份小龙虾。","监控显示，取走小龙虾的是一位流浪汉，他说「今晚运气真好」。"],privateClues:{1:["你终于放心了，你只是看了看。"],2:["你的照片成了关键证据。"],3:["你的测试日志证明你一直在工位。"],4:["你的证词帮了大忙。"],5:["你想起你确实做了一件好事。"],6:["你承认自己只是路过看了一眼。"]}}],
truth:{story:"真相是这样的：\n\n晚上8点，外卖送到前台。\n\n外卖小哥发现其中一份小龙虾应该是「不要辣」，但他拿错了「加辣」的。\n\n8:10他返回前台，打开盒子确认——果然拿错了。\n\n他把那份加辣的小龙虾拿走，准备换一份正确的。\n\n但他忘了把盒子盖上，也没留纸条。\n\n8:15张小胖路过，看到盒子开着，忍住了没吃。\n\n8:20李美丽来拿沙拉，拍照发了朋友圈。\n\n8:25刘大姐来打扫，看到开着的盒子，以为是吃剩的，收走放到了楼下「爱心冰箱」。\n\n8:40一位流浪汉从爱心冰箱取走了这份小龙虾。\n\n【反转】\n没有小偷，没有偷吃。\n\n只有一个粗心的外卖小哥、一个热心的保洁阿姨，\n\n和一位今晚「运气真好」的流浪汉。",reasoning:["李美丽8:20的照片证明盒子在8:20前就开着了。","刘大姐8:25才到，她不是第一个打开的人。","张小胖8:15看到盒子已经开着。","电梯监控显示外卖小哥8:10回来过一次。","外卖小哥承认他回来换餐，忘了盖盒子。","刘大姐把盒子放到了爱心冰箱，流浪汉取走了。","办公室里没有人真正吃过小龙虾。"],endings:[{name:"张小胖",text:"你成功忍住没吃小龙虾，减肥大业继续。"},{name:"李美丽",text:"你的朋友圈照片成了关键证据，获封「最佳记录官」。"},{name:"王铁柱",text:"测试日志证明清白，还顺便发现了两个bug。"},{name:"赵小萌",text:"转正答辩时讲了这次推理，面试官笑了。"},{name:"刘大姐",text:"公司给你颁了「爱心大使」奖，你不好意思地笑了。"},{name:"孙经理",text:"你请全组吃了一顿真正的小龙虾，没人再提这件事。"}]}};

{id:3,name:"吴小丽",role:"市场部",age:26,emoji:"💅",color:"#6c5ce7",intro:"你是吴小丽，26岁，市场部。\n\n你也在减肥，但你没忍住，偷偷在冰箱里放了一盒酸奶。\n\n你3:45去拿酸奶。\n\n你看到钱阿姨在翻冰箱。",secret:"【你的秘密】\n\n你3:45去拿酸奶时，看到钱阿姨在清理冰箱。\n\n你听到她嘀咕了一句「这个不能留」。\n\n但你不敢确定她说的是哪个。",timeline:"15:45 去茶水间拿酸奶\n15:45 看到钱阿姨在翻冰箱\n15:46 拿酸奶回工位\n16:00 听说蛋糕不见了",task:"说出你看到钱阿姨在做什么。"},

    else{S.connecting=false;toast('无法连接服务器，建议使用离线模式');S.screen='home';render();}
  },8000);
  try{
    S.peer=new Peer('svv-'+code,srv);
    S.peer.on('open',function(){
      clearTimeout(timeout);
      S.connected=true;S.connecting=false;setURL(code);
      S.HOST={players:[{id:S.myId,clientId:S.clientId,name:S.ME.name||'房主',charId:0,ready:true,voted:false,isHost:true,online:true}],phase:'lobby',round:0,messages:[],votes:{},voteDetails:[],discussionEnd:0,result:null};
      addSys('🎩 房间已创建。剧本：'+S.script.title);
      toast('✓ 房间已创建');render();broadcast();
    });
    S.peer.on('error',function(err){
      clearTimeout(timeout);
      if(err.type==='unavailable-id'){
        if(S.peer){try{S.peer.destroy();}catch(e){}S.peer=null;}
        var nc=genCode();S.roomCode=nc;S.myId='svv-'+nc;
        setTimeout(function(){tryCreatePeer(nc);},200);return;
      }
      if(S._attempt<PEER_SERVERS.length){if(S.peer){try{S.peer.destroy();}catch(e){}S.peer=null;}tryCreatePeer(code);}
      else{S.connecting=false;toast('网络错误：'+err.type);S.screen='home';render();}
    });
    S.peer.on('connection',function(conn){
      conn.on('open',function(){S.conns[conn.peer]=conn;});
      conn.on('data',function(d){onHostData(conn.peer,d);});
      conn.on('close',function(){delete S.conns[conn.peer];
        if(S.HOST){var p=S.HOST.players.find(function(x){return x.id===conn.peer;});
        if(p){p.online=false;addSys('💤 '+p.name+' 暂时离线');broadcast();}}});
    });
  }catch(e){
    clearTimeout(timeout);
    if(S._attempt<PEER_SERVERS.length)tryCreatePeer(code);
    else{S.connecting=false;toast('创建失败：'+e.message);S.screen='home';render();}
  }
}

function tryJoinPeer(code){
  if(typeof Peer==='undefined'){S.connecting=false;toast('网络库未加载');S.screen='home';render();return;}
  var idx=(S._attempt||0)%PEER_SERVERS.length;
  var srv=PEER_SERVERS[idx];S._attempt=(S._attempt||0)+1;
  S.PUB.statusMsg='连接信令服务器('+(idx+1)+'/'+PEER_SERVERS.length+')：'+srv.name;
  render();
  var joined=false;
  var timeout=setTimeout(function(){
    if(joined)return;
    if(S.peer){try{S.peer.destroy();}catch(e){}S.peer=null;}
    if(S._attempt<PEER_SERVERS.length)tryJoinPeer(code);
    else{S.connecting=false;toast('无法连接房主，建议使用离线模式');S.screen='home';render();}
  },15000);
  try{
    S.peer=new Peer(srv);
    S.peer.on('open',function(id){
      S.myId=id;
      var c=S.peer.connect('svv-'+code,{reliable:true});
      c.on('open',function(){
        clearTimeout(timeout);joined=true;S.connected=true;S.connecting=false;
        S.conns['host']=c;
        c.send({type:'join',name:S.ME.name,clientId:S.clientId});
        toast('✓ 已加入');render();
      });
      c.on('data',function(d){onClientData(d);});
      c.on('close',function(){S.connected=false;addSys('⚠️ 与房主断开');render();scheduleReconnect();});
      c.on('error',function(){clearTimeout(timeout);});
    });
    S.peer.on('error',function(err){
      clearTimeout(timeout);
      if(err.type==='peer-unavailable'){S.connecting=false;toast('找不到房间');S.screen='home';render();return;}
      if(S._attempt<PEER_SERVERS.length)tryJoinPeer(code);
      else{S.connecting=false;toast('网络错误：'+err.type);S.screen='home';render();}
    });
  }catch(e){
    clearTimeout(timeout);
    if(S._attempt<PEER_SERVERS.length)tryJoinPeer(code);
    else{S.connecting=false;toast('创建失败：'+e.message);S.screen='home';render();}
  }
}

function scheduleReconnect(){if(S.reconnectTimer)return;S.reconnectTimer=setTimeout(function(){S.reconnectTimer=null;if(S.connected||!S.roomCode||S.isHost)return;tryReconnect();},3000);}
function tryReconnect(){
  if(S.connected||!S.roomCode||!S.peer)return;
  try{
    var c=S.peer.connect('svv-'+S.roomCode,{reliable:true});
    var done=false;
    var t=setTimeout(function(){if(!done){try{c.close();}catch(e){}scheduleReconnect();}},8000);
    c.on('open',function(){clearTimeout(t);done=true;S.conns['host']=c;S.connected=true;c.send({type:'join',name:S.ME.name,clientId:S.clientId});addSys('✅ 已重连');render();});
    c.on('data',onClientData);
    c.on('close',function(){S.connected=false;scheduleReconnect();});
  }catch(e){scheduleReconnect();}
}
function leaveRoom(){
  Object.keys(S.conns).forEach(function(k){try{S.conns[k].close();}catch(e){}});
  if(S.peer){try{S.peer.destroy();}catch(e){}}
  S.conns={};S.peer=null;S.connected=false;S.connecting=false;S.isHost=false;
}
function Net_send(d){if(S.isHost){Object.keys(S.conns).forEach(function(k){try{S.conns[k].send(d);}catch(e){}});}else{var c=S.conns['host'];if(c&&c.open)c.send(d);}}
function Net_sendTo(id,d){var c=S.conns[id];if(c&&c.open){try{c.send(d);}catch(e){}}}

   房主逻辑
   ═══════════════════════════════════════════════════════════ */
function addSys(t){if(!S.HOST)return;S.HOST.messages.push({from:'sys',name:'主持人',text:t,type:'sys',ts:Date.now()});if(S.HOST.messages.length>200)S.HOST.messages=S.HOST.messages.slice(-200);}
function broadcast(){
  if(!S.isHost||!S.HOST)return;var H=S.HOST;
  var pub={phase:H.phase,round:H.round,players:H.players.map(function(p){return{id:p.id,name:p.name,hasChar:!!p.charId,ready:p.ready,voted:p.voted,isHost:p.isHost,online:p.online!==false};}),messages:H.messages.slice(-80),voteCount:H.voteDetails?H.voteDetails.length:0,totalPlayers:H.players.filter(function(p){return p.online!==false;}).length,discussionEnd:H.discussionEnd,votes:H.phase==='result'?H.votes:null,result:H.phase==='result'?H.result:null,isHost:false,statusMsg:''};
  var prev=S._lastPhase;S.PUB=Object.assign({},pub,{isHost:true,statusMsg:''});
  if(S.PUB.phase!==prev){S._lastPhase=S.PUB.phase;S.voted=false;S.voteTarget=0;}
  render();
  Object.keys(S.conns).forEach(function(pid){Net_sendTo(pid,{type:'state',state:pub});});
}
function sendPrivate(pid){
  var H=S.HOST;var p=H.players.find(function(x){return x.id===pid;});if(!p||!p.charId)return;
  var c=getChar(p.charId);var round=H.round;
  var clues=round>0?((S.script.rounds[round-1].privateClues[c.id])||[]):[];
  Net_sendTo(pid,{type:'private',charId:c.id,char:{id:c.id,name:c.name,role:c.role,age:c.age,emoji:c.emoji,color:c.color,intro:c.intro,secret:c.secret,timeline:c.timeline,task:c.task},clues:clues});
}
function onHostData(fromId,d){
  var H=S.HOST;if(!H)return;
  if(d.type==='join'){
    var exist=H.players.find(function(p){return p.clientId===d.clientId;});
    if(exist){exist.id=fromId;exist.online=true;setTimeout(function(){sendPrivate(fromId);},300);addSys('🔄 '+exist.name+' 重新连上');broadcast();return;}
    if(H.phase!=='lobby'){Net_sendTo(fromId,{type:'error',msg:'游戏已开始'});return;}
    var oc=H.players.filter(function(p){return p.online!==false;}).length;
    if(oc>=14){Net_sendTo(fromId,{type:'error',msg:'房间已满（最多14人）'});return;}
    H.players.push({id:fromId,clientId:d.clientId,name:d.name||'玩家',charId:0,ready:false,voted:false,isHost:false,online:true});
    addSys('👋 '+(d.name||'玩家')+' 加入');broadcast();
  }else if(d.type==='chat'){
    var p1=H.players.find(function(x){return x.id===fromId;});if(!p1)return;
    H.messages.push({from:fromId,name:p1.name,text:d.text,type:'chat',ts:Date.now()});
    if(H.messages.length>200)H.messages=H.messages.slice(-200);broadcast();
  }else if(d.type==='vote'){
    if(H.phase!=='vote')return;
    var p2=H.players.find(function(x){return x.id===fromId;});if(!p2||p2.voted)return;
    p2.voted=true;H.voteDetails.push({from:fromId,target:d.target});
    H.votes[d.target]=(H.votes[d.target]||0)+1;
    addSys('🗳 '+p2.name+' 已投票');broadcast();
    var op=H.players.filter(function(x){return x.online!==false;});
    if(op.every(function(x){return x.voted;}))setTimeout(function(){if(H.phase==='vote')doResult();},1000);
  }
}
function onClientData(d){
  if(d.type==='state'){
    var prev=S._lastPhase;S.PUB=Object.assign({},S.PUB,d.state);
    if(d.state.phase!==prev){S._lastPhase=d.state.phase;S.voted=false;S.voteTarget=0;}
    S.connected=true;render();
  }else if(d.type==='private'){
    S.ME.charId=d.charId;S.ME.char=d.char;S.ME.clues=d.clues||[];render();
  }else if(d.type==='error'){toast(d.msg);}
}
function hostAction(action,payload){
  var H=S.HOST;if(!H)return;
  if(action==='start'){var op=H.players.filter(function(p){return p.online!==false;});if(op.length<4)return toast('至少4名在线玩家');if(op.length>S.script.characters.length)return toast('玩家数超过剧本角色数（'+S.script.characters.length+'人），请选更大的剧本');var n=op.length;var picked=shuffle(S.script.characters).slice(0,n);op.forEach(function(p,i){p.charId=picked[i].id;});H.phase='intro';H.round=0;addSys('🎭 角色已分配。');broadcast();op.forEach(function(p){sendPrivate(p.id);});}
  else if(action==='toScript'){H.phase='script';broadcast();}
  else if(action==='toRound'){H.round++;H.phase='round'+H.round;H.discussionEnd=0;addSys('📢 第'+H.round+'轮开始。');broadcast();H.players.forEach(function(p){sendPrivate(p.id);});}
  else if(action==='startDiscuss'){var min=payload||5;H.discussionEnd=Date.now()+min*60*1000;addSys('⏱ 讨论开始，共 '+min+' 分钟。');broadcast();hostTimer(min);}
  else if(action==='endDiscuss'){H.discussionEnd=0;addSys('⏱ 讨论结束。');broadcast();}
  else if(action==='toVote'){H.phase='vote';H.votes={};H.voteDetails=[];H.players.forEach(function(p){p.voted=false;});addSys('🗳 进入投票。');broadcast();}
  else if(action==='reveal'){doResult();}
  else if(action==='restart'){H.phase='lobby';H.round=0;H.votes={};H.voteDetails=[];H.messages=[];H.result=null;H.discussionEnd=0;H.players.forEach(function(p){p.charId=0;p.ready=p.isHost;p.voted=false;});addSys('🔄 已重置。');broadcast();}
}
function doResult(){
  var H=S.HOST;if(!H)return;H.phase='result';
  var max=0,top=0;Object.keys(H.votes).forEach(function(cid){if(H.votes[cid]>max){max=H.votes[cid];top=parseInt(cid);}});
  var vc=S.script.characters.find(function(c){return c.id===top;});var rk=S.script.characters[0];
  H.result={votes:H.votes,votedChar:vc?{id:vc.id,name:vc.name}:null,realKiller:{id:rk.id,name:rk.name},isCorrect:vc&&vc.id===rk.id,truth:S.script.truth,voteDetails:H.voteDetails.map(function(v){var p=H.players.find(function(x){return x.id===v.from;});var t=S.script.characters.find(function(c){return c.id===v.target;});return{from:p?p.name:'?',target:t?t.name:'?'};})};
  addSys('🔍 真相揭晓！');broadcast();
}
var hostTimerHandle=null;
function hostTimer(min){if(hostTimerHandle)clearInterval(hostTimerHandle);var end=Date.now()+min*60*1000;
hostTimerHandle=setInterval(function(){if(!S.HOST||S.HOST.phase==='vote'||S.HOST.phase==='result'){clearInterval(hostTimerHandle);return;}
var rem=end-Date.now();if(rem>0&&rem<30000&&!S.HOST._warned){S.HOST._warned=true;addSys('⏰ 还剩30秒！');broadcast();}
if(rem<=0){clearInterval(hostTimerHandle);S.HOST.discussionEnd=0;addSys('⏰ 时间到！');broadcast();}},1000);}

var offlineTimer=null,offlineTimerSec=300,offlineTimerPaused=false;
function bindUI(){
  try{
    var ni=document.getElementById('nickInput');
    if(ni)ni.addEventListener('input',function(e){S.ME.name=e.target.value.trim();safeSet('svv-name',S.ME.name);});
    window._send=function(){
      var input=document.getElementById('chatInput');if(!input)return;
      var t=input.value.trim();if(!t)return;input.value='';
      if(S.isHost){var p=S.HOST.players.find(function(x){return x.id===S.myId;});
        S.HOST.messages.push({from:S.myId,name:p?p.name:'房主',text:t,type:'chat',ts:Date.now()});
        if(S.HOST.messages.length>200)S.HOST.messages=S.HOST.messages.slice(-200);broadcast();}
      else Net_send({type:'chat',text:t});
    };
    var cl=document.getElementById('chatList');if(cl)cl.scrollTop=cl.scrollHeight;
    if(S.timer){clearInterval(S.timer);S.timer=null;}
    if(S.screen==='game'&&S.PUB.discussionEnd>0){
      S.timer=setInterval(function(){
        var el=document.getElementById('td');if(!el)return;
        var rem=Math.max(0,S.PUB.discussionEnd-Date.now());
        var m=Math.floor(rem/60000);var s=Math.floor((rem%60000)/1000);
        el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
      },500);
    }
    if(S.screen==='offline-discuss'){
      if(!offlineTimer||offlineTimerSec<=0){offlineTimerSec=300;offlineTimerPaused=false;}
      if(offlineTimer)clearInterval(offlineTimer);
      offlineTimer=setInterval(function(){
        var el=document.getElementById('td');if(!el)return;
        if(!offlineTimerPaused&&offlineTimerSec>0)offlineTimerSec--;
        var m=Math.floor(offlineTimerSec/60000);var s=offlineTimerSec%60;
        el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
      },1000);
    } else {if(offlineTimer){clearInterval(offlineTimer);offlineTimer=null;}}
  }catch(e){console.error(e);}
}
function copyText(t){
  try{
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){toast('✓ 已复制');});}
    else{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');toast('✓ 已复制');ta.remove();}
  }catch(e){alert(t);}
}
function saveScript(){
  try{
    var idx=S.editingIndex>=0?S.editingIndex:S.scripts.indexOf(S.script);var sc=S.scripts[idx];if(!sc)return;
    sc.title=document.getElementById('e-title').value.trim()||sc.title;
    sc.subtitle=document.getElementById('e-sub').value.trim()||sc.subtitle;
    sc.emoji=document.getElementById('e-emoji').value.trim()||sc.emoji;
    sc.intro=document.getElementById('e-intro').value;sc.scene=document.getElementById('e-scene').value;
    sc.characters.forEach(function(c,i){
      c.name=document.getElementById('e-c'+i+'-name').value.trim()||c.name;
      c.role=document.getElementById('e-c'+i+'-role').value.trim()||c.role;
      c.intro=document.getElementById('e-c'+i+'-intro').value;
      c.secret=document.getElementById('e-c'+i+'-secret').value;
      c.timeline=document.getElementById('e-c'+i+'-timeline').value;
      c.task=document.getElementById('e-c'+i+'-task').value.trim()||c.task;
    });
    sc.rounds.forEach(function(r,i){
      r.title=document.getElementById('e-r'+i+'-title').value.trim()||r.title;
      var lines=document.getElementById('e-r'+i+'-clues').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
      if(lines.length)r.publicClues=lines;
    });
    sc.truth.story=document.getElementById('e-truth').value||sc.truth.story;
    var reasons=document.getElementById('e-reason').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
    if(reasons.length)sc.truth.reasoning=reasons;
    if(sc.isCustom)saveCustom();
    S.script=sc;toast('✓ 已保存');S.screen='scriptList';S.editingIndex=-1;render();
  }catch(e){toast('保存出错：'+e.message);}
}

/* ═══════════════════════════════════════════════════════════
   事件处理
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('click',function(e){
  try{
    var el=e.target.closest('[data-a]');if(!el)return;
    var a=el.dataset.a;
    var id=el.dataset.id?parseInt(el.dataset.id):null;
    var idx=el.dataset.idx?parseInt(el.dataset.idx):null;
    var min=el.dataset.min?parseInt(el.dataset.min):null;

    if(a==='createOnline'){
      if(!S.ME.name.trim())return toast('请先输入昵称');
      S.roomCode=genCode();S.screen='lobby';S._attempt=0;S.PUB.statusMsg='加载网络库...';render();
      loadPeerJS(function(ok){
        if(!ok){toast('无法加载网络库，请使用离线模式');S.screen='home';render();return;}
        tryCreatePeer(S.roomCode);
      });
    }
    else if(a==='acceptInvite'){
      if(!S.ME.name.trim())return toast('请输入昵称');
      var p=parseURL();if(!p.room)return;
      S.roomCode=p.room;S.screen='lobby';S._attempt=0;S.PUB.statusMsg='加载网络库...';render();
      loadPeerJS(function(ok){
        if(!ok){toast('无法加载网络库，请使用离线模式');S.screen='home';render();return;}
        tryJoinPeer(S.roomCode);
      });
    }
    else if(a==='leave'||a==='backHome'){
      leaveRoom();setURL(null);S.screen='home';S.HOST=null;S.roomCode='';
      S.PUB={phase:'lobby',round:0,players:[],messages:[],voteCount:0,totalPlayers:0,discussionEnd:0,votes:null,result:null,isHost:false,statusMsg:''};
      S.ME.charId=0;S.ME.char=null;S.ME.clues=[];
      if(S.timer){clearInterval(S.timer);S.timer=null;}
      if(offlineTimer){clearInterval(offlineTimer);offlineTimer=null;}
      render();
    }
    else if(a==='scriptList'){S.screen='scriptList';render();}
    else if(a==='backToList'){S.editingIndex=-1;S.screen='scriptList';render();}
    else if(a==='pickScript'){S.script=S.scripts[idx];S.screen='home';render();}
    else if(a==='editScript'){S.editingIndex=idx;S.screen='editor';render();}
    else if(a==='delScript'){var sc=S.scripts[idx];if(!sc.isCustom)return;if(!confirm('删除「'+sc.title+'」？'))return;S.scripts.splice(idx,1);saveCustom();if(S.script===sc)S.script=S.scripts[0];toast('已删除');render();}
    else if(a==='addScript'){
      var input=window.prompt('请输入剧本人数（4-14）：','6');
      var count=parseInt(input);
      if(!count||isNaN(count))return;
      if(count<4)count=4;
      if(count>14)count=14;
      var tpl=emptyTemplate(count);
      S.scripts.push(tpl);
      S.editingIndex=S.scripts.length-1;
      S.screen='editor';
      toast('已创建 '+count+' 人剧本，请填写内容');
      render();
    }
    else if(a==='saveScript'){saveScript();}
    else if(a==='declineInvite'){setURL(null);S.screen='home';render();}
    else if(a==='share'){var url=shareURL();if(navigator.share)navigator.share({title:S.script.title,text:'来玩剧本杀！',url:url}).catch(function(){});else copyText(url);}
    else if(a==='copyLink'){copyText(shareURL());}
    else if(a==='startGame'){if(!S.isHost)return;hostAction('start');S.screen='game';render();}
    else if(a==='toScript'){if(!S.isHost)return;hostAction('toScript');render();}
    else if(a==='toRound'){if(!S.isHost)return;hostAction('toRound');render();}
    else if(a==='nextRound'){if(!S.isHost)return;if(S.PUB.round>=3)hostAction('toVote');else hostAction('toRound');render();}
    else if(a==='discuss'){if(!S.isHost)return;hostAction('startDiscuss',min||5);render();}
    else if(a==='endDiscuss'){if(!S.isHost)return;hostAction('endDiscuss');render();}
    else if(a==='reveal'){if(!S.isHost)return;doResult();render();}
    else if(a==='selVote'){if(S.voted)return;if(S.ME.charId===id)return toast('不能投给自己');S.voteTarget=id;render();}
    else if(a==='submitVote'){
      if(S.voted||!S.voteTarget)return;
      if(S.isHost){var H=S.HOST;var me=H.players.find(function(p){return p.id===S.myId;});
        if(me&&!me.voted){me.voted=true;H.voteDetails.push({from:S.myId,target:S.voteTarget});H.votes[S.voteTarget]=(H.votes[S.voteTarget]||0)+1;addSys('🗳 '+me.name+' 已投票');broadcast();
        var op=H.players.filter(function(p){return p.online!==false;});if(op.every(function(p){return p.voted;}))setTimeout(function(){if(H.phase==='vote')doResult();},1000);}}
      else Net_send({type:'vote',target:S.voteTarget});
      S.voted=true;render();
    }
    else if(a==='restart'){if(!S.isHost)return;hostAction('restart');S.screen='lobby';render();}
    else if(a==='sendChat'){window._send();}
    else if(a==='gotoMonopoly'){window.location.href='monopoly.html';}
    else if(a==='offlineSetup'){S.screen='offline-setup';render();}
    else if(a==='offlineStart'){
      var count2=S.script.characters.length;
      var names=[];
      for(var i=0;i<count2;i++){var v=document.getElementById('on'+i).value.trim();if(!v)return toast('请输入玩家 '+(i+1)+' 昵称');names.push(v);}
      var picked=shuffle(S.script.characters).slice(0,count2);
      S.G={players:names.map(function(n,i){return{name:n,charId:picked[i].id};}),idx:0,round:1,votes:[],voteIdx:0};
      offlineTimerSec=300;offlineTimerPaused=false;
      S.screen='offline-pass';render();
    }
    else if(a==='offlineRead'){S.screen='offline-script';render();}
    else if(a==='offlineNext'){
      S.G.idx++;
      if(S.G.idx>=S.G.players.length){S.G.idx=0;S.screen='offline-round';}
      else S.screen='offline-pass';
      render();
    }
    else if(a==='offlineShowPrivate'){S.screen='offline-private';render();}
    else if(a==='offlineNextPrivate'){
      S.G.idx++;
      if(S.G.idx>=S.G.players.length){S.screen='offline-discuss';}
      else S.screen='offline-pass';
      render();
    }
    else if(a==='offlineToggleTimer'){offlineTimerPaused=!offlineTimerPaused;toast(offlineTimerPaused?'已暂停':'继续');render();}
    else if(a==='offlineNextRound'){
      if(S.G.round<3){S.G.round++;S.G.idx=0;S.screen='offline-round';}
      render();
    }
    else if(a==='offlineToVote'){
      S.G.voteIdx=0;S.G.votes=[];S.screen='offline-vote';
      render();
    }
    else if(a==='offlineSelVote'){
      var isMe=S.G.players[S.G.voteIdx].charId===id;
      if(isMe)return toast('不能投给自己');
      S.G.votes.push({voterIdx:S.G.voteIdx,target:id});
      render();
    }
    else if(a==='offlineNextVote'){
      S.G.voteIdx++;
      if(S.G.voteIdx>=S.G.players.length){S.screen='offline-result';}
      render();
    }
  }catch(err){console.error('click error',err);}
});

/* ═══════════════════════════════════════════════════════════
   初始化
   ═══════════════════════════════════════════════════════════ */
try{
  var n=safeGet('svv-name');if(n)S.ME.name=n;
  S.scripts=loadScripts();
  if(!S.scripts||S.scripts.length===0)S.scripts=[SC1,SC2,SC3,SC4];
  S.script=S.scripts[0];
  try{var cid=sessionStorage.getItem('svv-cid');
    if(!cid){cid='c_'+Math.random().toString(36).slice(2,10);sessionStorage.setItem('svv-cid',cid);}
    S.clientId=cid;
  }catch(e){S.clientId='c_'+Math.random().toString(36).slice(2,10);}
  render();
}catch(e){
  console.error('init error',e);
  document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:#e17055"><h2>初始化失败</h2><p style="margin-top:12px;color:#8b9aa8">'+e.message+'</p></div>';
}
</script>
</body>
</html>
