<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>塔罗 · 牌阵</title>
<style>
:root{
  --paper:#FAF6EE;--paper2:#F2ECE0;--paper3:#EDE7DA;
  --ink:#4A443C;--ink2:#8A8177;--ink3:#B4ACA1;
  --line:rgba(74,68,60,.13);--line2:rgba(74,68,60,.22);
  --accent:#8B7355;--accent2:#C4A882;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 8%,rgba(200,180,150,.16),transparent 42%),
    radial-gradient(circle at 85% 85%,rgba(170,160,200,.13),transparent 45%),
    radial-gradient(circle at 60% 30%,rgba(190,205,180,.10),transparent 40%),
    #F5F0E6;
  background-attachment:fixed;
  font-size:14px;line-height:1.7;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:620px;margin:0 auto;padding:20px 16px 80px;position:relative;z-index:1}
h1{font-size:26px;font-weight:600;letter-spacing:2px;font-family:Georgia,'Songti SC',serif}
h2{font-size:19px;font-weight:600;letter-spacing:1px;font-family:Georgia,'Songti SC',serif;margin-bottom:6px}
h3{font-size:14px;font-weight:600;color:var(--accent);letter-spacing:2px;margin:22px 0 10px;text-transform:uppercase;opacity:.85}
.hint{color:var(--ink2);font-size:12.5px;line-height:1.8}
.mono{font-family:'SF Mono',Menlo,Consolas,monospace}

.hero{text-align:center;padding:34px 0 26px}
.hero-glyph{font-size:52px;line-height:1;opacity:.9}
.hero h1{margin-top:14px;color:var(--ink)}
.hero-sub{margin-top:10px;color:var(--ink2);font-size:12px;letter-spacing:4px;text-transform:uppercase}
.hero-rule{width:44px;height:1px;background:var(--line2);margin:20px auto}

.btn{
  display:block;width:100%;padding:15px 18px;
  border:1px solid var(--line2);border-radius:10px;
  background:rgba(255,255,255,.55);color:var(--ink);
  font-size:15px;font-weight:500;font-family:inherit;letter-spacing:1px;
  cursor:pointer;margin-top:11px;transition:.2s ease;text-align:center;
}
.btn:active{transform:scale(.985);background:rgba(255,255,255,.85)}
.btn.primary{background:var(--ink);color:#FBF7EF;border-color:var(--ink)}
.btn.primary:active{background:#5C554B}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:10px 14px;font-size:13px;margin-top:8px}
.btn.danger{color:#A86868;border-color:rgba(168,104,104,.3)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{margin-top:0;flex:1}

.card{
  background:rgba(255,255,255,.55);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;margin-bottom:12px;
}
.input{
  width:100%;background:rgba(255,255,255,.7);
  border:1px solid var(--line2);border-radius:10px;
  padding:13px 15px;font-size:15px;font-family:inherit;color:var(--ink);
  outline:none;margin-bottom:10px;transition:.2s;
}
.input:focus{border-color:var(--accent2);background:#fff}
.input::placeholder{color:var(--ink3)}
textarea.input{min-height:80px;resize:vertical;line-height:1.7}
label.fl{display:block;font-size:12px;color:var(--ink2);letter-spacing:1px;margin:14px 0 6px}

.spread-item{
  display:flex;align-items:center;gap:16px;padding:16px 18px;margin-bottom:11px;
  background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:14px;
  cursor:pointer;transition:.2s;
}
.spread-item:active{transform:scale(.985);background:rgba(255,255,255,.85)}
.si-glyph{
  width:52px;height:52px;flex-shrink:0;border-radius:10px;
  background:var(--paper2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--accent);
}
.si-body{flex:1;min-width:0}
.si-name{font-size:15.5px;font-weight:600;letter-spacing:.5px}
.si-desc{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.6}
.si-count{font-size:11px;color:var(--ink3);letter-spacing:1px;margin-top:5px;font-family:'SF Mono',monospace}
.si-arrow{color:var(--ink3);font-size:18px;flex-shrink:0}

.mini-stage{
  position:relative;width:100%;aspect-ratio:1/.75;
  background:rgba(255,255,255,.4);border:1px solid var(--line);
  border-radius:14px;margin:14px 0 18px;overflow:hidden;
}
.mini-card{
  position:absolute;transform:translate(-50%,-50%);
  width:13%;aspect-ratio:100/160;background:var(--paper);
  border:1px solid var(--line2);border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--accent);font-family:Georgia,serif;
}
.pos-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.pos-row:last-child{border-bottom:none}
.pos-num{
  width:24px;height:24px;flex-shrink:0;border-radius:50%;
  background:var(--paper2);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--accent);font-family:Georgia,serif;margin-top:1px;
}
.pos-body{flex:1}
.pos-name{font-size:14px;font-weight:600;letter-spacing:.5px}
.pos-mean{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.65}

.drawing{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.shuffle-stack{position:relative;width:120px;height:190px;margin-bottom:34px}
.shuffle-stack .sc{
  position:absolute;inset:0;border-radius:6px;background:var(--paper);
  border:1px solid var(--line2);animation:shuf 1.3s ease-in-out infinite;
}
.shuffle-stack .sc:nth-child(2){animation-delay:.12s}
.shuffle-stack .sc:nth-child(3){animation-delay:.24s}
.shuffle-stack .sc:nth-child(4){animation-delay:.36s}
@keyframes shuf{0%,100%{transform:rotate(-6deg) translateY(0);opacity:.5}50%{transform:rotate(6deg) translateY(-8px);opacity:1}}
.draw-text{color:var(--ink2);font-size:13px;letter-spacing:3px}

.stage{position:relative;width:100%;margin:6px 0 24px}
.slot-wrap{position:absolute;transform:translate(-50%,-50%);aspect-ratio:100/160}
.slot-rot{width:100%;height:100%;transition:transform .5s}
.slot-anim{width:100%;height:100%;animation:cardIn .6s cubic-bezier(.2,.8,.3,1) backwards;cursor:pointer}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.slot-anim svg,.slot-anim img{
  display:block;width:100%;height:100%;
  filter:drop-shadow(0 3px 12px rgba(74,68,60,.16));
  border-radius:4px;
}
.slot-badge{
  position:absolute;top:-7px;left:-7px;width:18px;height:18px;border-radius:50%;
  background:var(--ink);color:#FBF7EF;font-size:10px;font-family:Georgia,serif;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:3;
}

.reading{
  background:rgba(255,255,255,.62);border:1px solid var(--line);
  border-radius:16px;padding:20px 20px 22px;margin-top:8px;
}
.reading-h{font-size:11px;letter-spacing:3px;color:var(--accent);margin:0 0 12px;text-transform:uppercase;font-weight:600}
.reading-h:not(:first-child){margin-top:26px}
.reading-p{font-size:14px;line-height:1.95;color:var(--ink);margin-bottom:12px}
.reading-p:last-child{margin-bottom:0}
.reading-p .em{color:var(--accent);font-weight:600}

.rc{padding:14px 0;border-bottom:1px dashed var(--line)}
.rc:last-child{border-bottom:none;padding-bottom:0}
.rc-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rc-idx{
  width:19px;height:19px;border-radius:50%;background:var(--paper2);
  border:1px solid var(--line2);font-size:10px;font-family:Georgia,serif;
  color:var(--accent);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;top:1px;
}
.rc-pos{font-size:13px;font-weight:600;letter-spacing:.5px}
.rc-name{font-size:12px;color:var(--accent);font-family:Georgia,'Songti SC',serif}
.rc-mean{font-size:12px;color:var(--ink3);line-height:1.6;margin-bottom:5px}
.rc-text{font-size:13.5px;line-height:1.85;color:var(--ink)}

.ed-sec{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:11px}
.ed-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ed-title{font-size:12px;color:var(--accent);letter-spacing:2px;font-weight:600}
.ed-del{background:none;border:none;color:#A86868;font-size:12px;font-family:inherit;cursor:pointer;padding:2px 6px}

.lib-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.lib-card{cursor:pointer;transition:.2s}
.lib-card:active{transform:scale(.95)}
.lib-card svg,.lib-card img{display:block;width:100%;border-radius:4px;filter:drop-shadow(0 2px 6px rgba(74,68,60,.10))}
.lib-name{font-size:9.5px;text-align:center;margin-top:5px;color:var(--ink2);line-height:1.3;letter-spacing:.2px}

.modal{
  position:fixed;inset:0;z-index:200;background:rgba(60,54,46,.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal-box{
  background:#FBF7EF;border-radius:18px;max-width:420px;width:100%;
  max-height:88vh;overflow-y:auto;padding:24px 22px;
  box-shadow:0 24px 60px rgba(60,54,46,.35);
  animation:pop .25s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box .m-name{font-size:20px;font-family:Georgia,'Songti SC',serif;letter-spacing:1px;text-align:center}
.modal-box .m-sub{font-size:11px;color:var(--ink3);letter-spacing:2px;margin-top:5px;text-transform:uppercase;text-align:center}
.modal-box .m-body{font-size:13.5px;line-height:1.9;margin-top:14px;color:var(--ink)}
.m-section{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.m-section:first-child{border-top:none;margin-top:0;padding-top:0}
.m-label{font-size:10.5px;letter-spacing:2px;color:var(--accent);font-weight:600;margin-bottom:5px;text-transform:uppercase}
.m-text{font-size:13px;line-height:1.85;color:var(--ink)}
.m-text.dim{color:var(--ink3)}
.m-pos-name{font-size:14px;font-weight:600}
.m-pos-mean{font-size:12.5px;color:var(--ink2);margin-top:2px}
.m-hl{background:rgba(196,168,130,.12);border-left:2px solid var(--accent2);padding:8px 12px;border-radius:0 8px 8px 0}

.toast{
  position:fixed;top:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#FBF7EF;padding:11px 22px;border-radius:100px;
  font-size:13px;z-index:999;max-width:88%;text-align:center;
  animation:tin .3s;box-shadow:0 8px 24px rgba(60,54,46,.25);
}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

.footer{text-align:center;color:var(--ink3);font-size:11px;letter-spacing:2px;margin-top:34px}
</style>
</head>

/* ═══════════════════════════════════════════════
   工具
   ═══════════════════════════════════════════════ */
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function toast(m){var e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove();},2200);}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function safeGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}

/* ═══════════════════════════════════════════════
   卡牌图片挂载点（可被用户替换为真实韦特图）
   ═══════════════════════════════════════════════ */
var CARD_IMAGES = {};
function loadCardImages(){
  try{
    var s = safeGet('tarot-card-images-v1');
    if(s) CARD_IMAGES = JSON.parse(s) || {};
  }catch(e){ CARD_IMAGES = {}; }
}
function saveCardImages(){
  try{
    localStorage.setItem('tarot-card-images-v1', JSON.stringify(CARD_IMAGES));
    return true;
  }catch(e){ return false; }
}

function buildDeck(){
  var deck=[];
  MAJOR_DATA.forEach(function(m,i){
    deck.push({id:'m'+i,arcana:'major',key:m[2],numeral:ROMAN[i],name:m[0],en:m[1],up:m[3],rev:m[4],element:null,suit:null,rank:0});
  });
  Object.keys(SUITS).forEach(function(sk){
    var s=SUITS[sk];
    for(var r=1;r<=14;r++){
      var nm = r<=10 ? (s.name+CN_NUM[r]) : (s.name+COURT[r]);
      var num = r<=10 ? String(r) : COURT[r];
      deck.push({id:sk+r,arcana:'minor',suit:sk,rank:r,element:s.el,numeral:num,name:nm,en:'',
        up:'在'+s.theme+'的领域里，'+RANK_DATA[r].up+'。',
        rev:'在'+s.theme+'的领域里，'+RANK_DATA[r].rev+'。'});
    }
  });
  return deck;
}

function minorArt(card){
  var out='<rect width="100" height="132" fill="'+SUITS[card.suit].color+'"/>';
  out+='<rect y="0" width="100" height="132" fill="#FBF7EF" opacity="0.55"/>';
  var sym=SUIT_ART[card.suit];
  if(card.rank>=11){
    out+='<circle cx="50" cy="46" r="6" fill="#F5CBA7" stroke="#4A443C" stroke-width="0.4"/>';
    out+='<path d="M44 56 L38 92 L62 92 L56 56 Z" fill="'+SUITS[card.suit].color+'" stroke="#4A443C" stroke-width="0.4"/>';
    out+='<g transform="translate(50,76) scale(3.2)">'+sym+'</g>';
  }else{
    var pts=PIP_LAYOUTS[card.rank]||PIP_LAYOUTS[1];
    var sc=card.rank>=8?0.68:(card.rank>=6?0.8:1.0);
    pts.forEach(function(p){
      var y=Math.round(p[1]*132/160);
      out+='<g transform="translate('+p[0]+','+y+') scale('+sc+')">'+sym+'</g>';
    });
  }
  return out;
}

function svgCardFace(card,reversed){
  var art = card.arcana==='major' ? MAJOR_ART[card.key] : minorArt(card);
  var rot = reversed ? ' transform="rotate(180 50 66)"' : '';
  return '<svg viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">'+
    '<rect x="0.5" y="0.5" width="99" height="159" rx="5" fill="#FBF7EF"/>'+
    '<g clip-path="url(#cc_'+card.id+'_'+(reversed?'r':'u')+')">'+
      '<g'+rot+'>'+ art +'</g>'+
    '</g>'+
    '<rect x="7" y="132" width="86" height="22" fill="#FBF7EF" opacity="0.94"/>'+
    '<text x="50" y="143" text-anchor="middle" font-family="Georgia,\'Songti SC\',serif" font-size="9.5" letter-spacing="1" fill="#4A443C">'+esc(card.name)+'</text>'+
    '<line x1="30" y1="147" x2="70" y2="147" stroke="#4A443C" stroke-opacity="0.25" stroke-width="0.6"/>'+
    '<text x="50" y="156" text-anchor="middle" font-family="Georgia,serif" font-size="6.5" letter-spacing="1.5" fill="#8A8177">'+esc(card.numeral)+'</text>'+
    '<rect x="0.5" y="0.5" width="99" height="159" rx="5" fill="none" stroke="#4A443C" stroke-opacity="0.35" stroke-width="1"/>'+
    '<rect x="4.5" y="4.5" width="91" height="151" rx="3" fill="none" stroke="#4A443C" stroke-opacity="0.12" stroke-width="0.6"/>'+
    '<defs><clipPath id="cc_'+card.id+'_'+(reversed?'r':'u')+'"><rect x="5" y="5" width="90" height="150" rx="3"/></clipPath></defs>'+
  '</svg>';
}

function cardFace(card,reversed){
  var url = CARD_IMAGES[card.id];
  if(url){
    var rot = reversed ? 'transform:rotate(180deg);' : '';
    return '<div style="position:relative;width:100%;height:100%">'+
      '<img src="'+esc(url)+'" alt="'+esc(card.name)+'" style="display:block;width:100%;height:100%;object-fit:cover;border-radius:4px;'+rot+'" '+
        'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">'+
      '<div style="display:none;width:100%;height:100%">'+svgCardFace(card,reversed)+'</div>'+
    '</div>';
  }
  return svgCardFace(card,reversed);
}

   AI 解读生成

function buildReading(){
  var sp=S.spread, drawn=S.drawn, q=S.question.trim()||'你此刻的处境';
  var n=drawn.length;
  var major=drawn.filter(function(d){return d.card.arcana==='major';}).length;
  var revs=drawn.filter(function(d){return d.reversed;}).length;
  var elems={};
  drawn.forEach(function(d){ if(d.card.element) elems[d.card.element]=(elems[d.card.element]||0)+1; });
  var out=[];

  var p1='你以「<span class="em">'+esc(sp.name)+'</span>」提出了关于「<span class="em">'+esc(q)+'</span>」的问题。';
  p1+='这次抽出了 <span class="em">'+n+'</span> 张牌，其中大阿卡纳 '+major+' 张、逆位 '+revs+' 张。';
  if(major/n>=0.5){
    p1+='大阿卡纳占了多数，说明这件事牵动的是你生命中比较根本的课题——它不是随手就能翻过去的日常小事，而更像是一次必须认真对待的转折。';
  }else if(major>0){
    p1+='命运之牌与日常之牌交错出现，说明这件事既有你无法完全掌控的部分，也有你可以亲手推动的部分。分清这两者，是解牌的第一步。';
  }else{
    p1+='这组牌全部是小阿卡纳，意味着眼下的局面完全由具体的人、事、行动构成。它不神秘，也不宿命——它是可以被调整的。';
  }
  out.push({h:'整体气象',p:[p1]});

  var rows=drawn.map(function(d,i){
    var p=d.pos, c=d.card;
    var meaning = d.reversed ? c.rev : c.up;
    var head='<div class="rc-head">'+
      '<span class="rc-idx">'+(i+1)+'</span>'+
      '<span class="rc-pos">'+esc(p.name)+'</span>'+
      '<span class="rc-name">'+esc(c.name)+(d.reversed?' · 逆位':' · 正位')+'</span>'+
    '</div>';
    var mean='<div class="rc-mean">这个位置问的是：'+esc(p.meaning)+'</div>';
    var txt='<div class="rc-text">牌面在这里给出了'+esc(c.name)+(d.reversed?'（逆位）':'')+'——'+esc(meaning)+
      (d.reversed?' 逆位并不是「坏」，它更多是在说：这股能量被卡住了，或者用过头了。':' 这是一股相对顺畅的能量，可以顺着它走。')+'</div>';
    return '<div class="rc">'+head+mean+txt+'</div>';
  }).join('');
  out.push({h:'逐位解读',raw:rows});

  var p3='';
  var elNames=Object.keys(elems);
  if(elNames.length>0){
    elNames.sort(function(a,b){return elems[b]-elems[a];});
    var top=elNames[0];
    var elMap={
      '火':'火元素（权杖）最突出，行动力和热情是这组牌的主调。你并不缺动力，要小心的是冲得太快、把耐心丢在后面。',
      '水':'水元素（圣杯）最突出，情感与关系是这件事真正的核心。理智的分析在这里帮不上太多忙，你需要先承认自己的感受。',
      '风':'风元素（宝剑）最突出，这是一场头脑层面的博弈。想清楚比做得多更重要，但也要小心陷入过度分析和自我辩论。',
      '土':'土元素（星币）最突出，这件事最终要落在具体的资源、时间、金钱和身体上。务实的推进比漂亮的构想更有价值。'
    };
    p3+=elMap[top]||'';
    if(elNames.length>=3) p3+=' 四种元素都出现了，说明这件事牵涉的面向很广，需要你同时照顾到好几个层面。';
    else if(elNames.length===1) p3+=' 元素高度集中，说明这件事的焦点非常明确，几乎没有旁枝末节。';
  }
  if(p3) out.push({h:'元素结构',p:[p3]});

  var p4='';
  if(revs===0){
    p4+='所有牌都是正位，这是一个非常顺畅的信号——能量没有被切断，你目前的方向大体是对的，剩下的只是时间问题。';
  }else if(revs===n){
    p4+='所有牌都是逆位。这并不意味着「坏」，而是说明——此刻的能量大多卡在内部：你可能还没准备好，或者一直在原地打转。';
    p4+='先把阻力看清楚，比急着行动更重要。逆位从来不是判决书，它只是提醒你：现在用的方法可能不对。';
  }else if(revs>=n*0.5){
    p4+='逆位过半，说明这件事目前的阻力大于助力。但这恰恰是有价值的信息——它告诉你哪些地方需要先松开，而不是硬推。';
  }else{
    p4+='正位多于逆位，整体趋势是向前走的，只是中间有几处需要你留意的坎。';
  }
  p4+=' 把这几张牌连起来看，它们并不是在替你决定什么，而是把你其实已经隐约知道的东西，摆到了台面上。';
  out.push({h:'综合',p:[p4]});

  out.push({h:'给你的话',p:[
    '塔罗不预测未来，它只描述此刻的能量结构。真正的选择，始终在你手上。'+
    '如果这组牌让你有什么不舒服的地方，那份不舒服本身，往往就是最值得看的地方。'
  ]});
  return out;
}

function renderReading(){
  return buildReading().map(function(s){
    var head='<div class="reading-h">'+esc(s.h)+'</div>';
    if(s.raw) return head+s.raw;
    return head+s.p.map(function(x){return '<div class="reading-p">'+x+'</div>';}).join('');
  }).join('');
}

}

    '<div class="hint">'+esc(sp.desc)+'</div>';
  h+='<div class="mini-stage">';

function rDrawing(){

function rResult(){
  var sp=S.spread, drawn=S.drawn, n=drawn.length;
  var stageW = n===1?46:(n===2?36:(n===3?30:(n===4?27:(n<=6?24:(n<=8?21:(n<=10?18:16))))));
  var h='<div class="screen">';
  h+='<h2 style="text-align:center">'+esc(sp.name)+'</h2>';
  if(S.question.trim()) h+='<div class="hint" style="text-align:center;margin-bottom:4px">「'+esc(S.question.trim())+'」</div>';
  h+='<div class="hint" style="text-align:center;font-size:11px;color:var(--ink3);margin-bottom:6px">点击任意牌查看正逆位含义</div>';
  h+='<div class="stage" style="aspect-ratio:1/'+sp.ratio+'">';
  drawn.forEach(function(d,i){
    var pt=sp.layout[i]||[50,50];
    var extra='transform:translate(-50%,-50%);';
    if(sp.id==='celtic'&&i===1) extra='transform:translate(-50%,-50%) rotate(90deg);';
    h+='<div class="slot-wrap" data-a="showCard" data-i="'+i+'" style="left:'+pt[0]+'%;top:'+pt[1]+'%;width:'+stageW+'%;'+extra+'">'+
      '<div class="slot-rot" style="'+(d.reversed?'transform:rotate(180deg)':'')+'">'+
        '<div class="slot-anim" style="animation-delay:'+(i*0.09)+'s">'+
          '<span class="slot-badge">'+(i+1)+'</span>'+
          cardFace(d.card,d.reversed)+
        '</div>'+
      '</div>'+
    '</div>';
  });
  h+='</div>';
  h+='<div class="reading">'+renderReading()+'</div>';
  h+='<button class="btn primary" data-a="again" style="margin-top:18px">再抽一次</button>'+
     '<button class="btn ghost" data-a="spreads">换个牌阵</button>'+
     '<button class="btn ghost" data-a="home">返回首页</button>';
  h+='</div>';
  return h;
}

function rEditor(){
  var e=S.editor;
  var h='<div class="screen">'+
    '<h2>创建牌阵</h2>'+
    '<div class="hint" style="margin-bottom:14px">定义每个位置的含义，保存后可以反复使用。</div>'+
    '<label class="fl">牌阵名称</label>'+
    '<input class="input" id="edName" placeholder="例如：事业十字" value="'+esc(e.name)+'" maxlength="12">'+
    '<label class="fl">一句话说明</label>'+
    '<input class="input" id="edDesc" placeholder="这个牌阵用来回答什么问题" value="'+esc(e.desc)+'" maxlength="40">'+
    '<h3>位置定义</h3>';
  e.positions.forEach(function(p,i){
    h+='<div class="ed-sec">'+
      '<div class="ed-head">'+
        '<span class="ed-title">位置 '+(i+1)+'</span>'+
        (e.positions.length>1?'<button class="ed-del" data-a="delPos" data-i="'+i+'">删除</button>':'')+
      '</div>'+
      '<input class="input" data-f="posName" data-i="'+i+'" placeholder="位置名称，例如：现状" value="'+esc(p.name)+'" maxlength="10" style="margin-bottom:6px">'+
      '<textarea class="input" data-f="posMean" data-i="'+i+'" placeholder="这个位置代表什么含义" style="min-height:56px;margin-bottom:0">'+esc(p.meaning)+'</textarea>'+
    '</div>';
  });
  h+='<button class="btn" data-a="addPos">＋ 添加位置</button>'+
     '<button class="btn primary" data-a="saveCustom" style="margin-top:16px">保存牌阵</button>'+

function bindEditor(){
  var app=document.getElementById('app');
  function sync(){
    var nm=document.getElementById('edName');
    var ds=document.getElementById('edDesc');
    if(nm) S.editor.name=nm.value;
    if(ds) S.editor.desc=ds.value;
    app.querySelectorAll('[data-f="posName"]').forEach(function(el){
      var i=parseInt(el.dataset.i); if(S.editor.positions[i]) S.editor.positions[i].name=el.value;
    });
    app.querySelectorAll('[data-f="posMean"]').forEach(function(el){
      var i=parseInt(el.dataset.i); if(S.editor.positions[i]) S.editor.positions[i].meaning=el.value;
    });
  }
  S._syncEditor=sync;
  app.addEventListener('input',function(ev){
    if(ev.target.dataset.f||ev.target.id==='edName'||ev.target.id==='edDesc') sync();
  });
}

function rLibrary(){
  var page=S.libPage, per=24;
  var start=page*per, end=Math.min(start+per,S.deck.length);
  var total=Math.ceil(S.deck.length/per);
  var h='<div class="screen"><h2>牌义速查</h2>'+
    '<div class="hint" style="margin-bottom:14px">共 '+S.deck.length+' 张牌 · 第 '+(page+1)+' / '+total+' 页 · 点击任意牌查看正逆位含义</div>'+
    '<div class="lib-grid">';
  for(var i=start;i<end;i++){
    var c=S.deck[i];
    h+='<div class="lib-card" data-a="showLibCard" data-i="'+i+'">'+
      cardFace(c,false)+
      '<div class="lib-name">'+esc(c.name)+'</div>'+
    '</div>';
  }
  h+='</div>';
  h+='<div class="btn-row" style="margin-top:20px">'+
    (page>0?'<button class="btn sm" data-a="libPrev">上一页</button>':'')+
    (end<S.deck.length?'<button class="btn sm" data-a="libNext">下一页</button>':'')+
  '</div>';
  h+='<button class="btn ghost" data-a="home" style="margin-top:14px">返回首页</button></div>';
  return h;
}

/* ═══════════════════════════════════════════════
   事件
   ═══════════════════════════════════════════════ */
document.addEventListener('click',function(e){
  try{
    var el=e.target.closest('[data-a]');
    if(!el) return;
    if(e.target.closest('[data-stop]') && el.dataset.a==='closeModal' && e.target.closest('.modal-box') && !e.target.closest('button')) return;
    var a=el.dataset.a;
    var i = el.dataset.i!==undefined ? parseInt(el.dataset.i) : null;

    if(a==='home'){ S.screen='home'; S.spread=null; S.drawn=[]; S.detailCard=null; render(); }
    else if(a==='spreads'){ S.screen='spreads'; S.spread=null; S.detailCard=null; render(); }
    else if(a==='library'){ S.screen='library'; S.libPage=0; render(); }
    else if(a==='imgset'){ S.screen='imgset'; render(); }
    else if(a==='libNext'){ S.libPage++; render(); }
    else if(a==='libPrev'){ if(S.libPage>0)S.libPage--; render(); }
    else if(a==='showLibCard'){
      var c=S.deck[i];
      S.detailCard={card:c,reversed:false,pos:{name:'牌义',meaning:c.arcana==='major'?'大阿卡纳 · 第 '+c.numeral+' 号':'小阿卡纳 · '+SUITS[c.suit].name+' · '+SUITS[c.suit].el+'元素'}};
      render();
    }
    else if(a==='pickSpread'){ S.spread=allSpreads()[i]; S.screen='detail'; render(); }
    else if(a==='startDraw'){ var qi=document.getElementById('qInput'); if(qi) S.question=qi.value; startDraw(); }
    else if(a==='again'){ startDraw(); }
    else if(a==='showCard'){ S.detailCard=S.drawn[i]; render(); }
    else if(a==='closeModal'){ S.detailCard=null; render(); }
    else if(a==='custom'){
      S.editor={name:'',desc:'',positions:[{name:'',meaning:''},{name:'',meaning:''},{name:'',meaning:''}]};
      S.screen='editor'; render();
    }
    else if(a==='addPos'){
      if(S._syncEditor)S._syncEditor();
      if(S.editor.positions.length>=12) return toast('最多 12 个位置');
      S.editor.positions.push({name:'',meaning:''});
      S.screen='editor'; render();
    }
    else if(a==='delPos'){
      if(S._syncEditor)S._syncEditor();
      S.editor.positions.splice(i,1);
      S.screen='editor'; render();
    }
    else if(a==='saveCustom'){
      if(S._syncEditor)S._syncEditor();
      var e2=S.editor;
      var nm=(e2.name||'').trim()||'我的牌阵';
      var ds=(e2.desc||'').trim()||'自定义牌阵';
      var pos=e2.positions.filter(function(p){return (p.name||'').trim();});
      if(pos.length===0) return toast('至少填写一个位置名称');
      pos=pos.map(function(p){return {name:p.name.trim(),meaning:(p.meaning||'').trim()||'这个位置代表的含义。'};});
      S.custom.push({id:'custom_'+Date.now(),isCustom:true,name:nm,desc:ds,glyph:String(pos.length),ratio:1.1,positions:pos,layout:autoLayout(pos.length)});
      persistCustom();
      toast('✓ 已保存');
      S.screen='spreads'; render();
    }
    else if(a==='backFromEditor'){ S.screen='spreads'; render(); }
    else if(a==='delCustom'){
      if(!S.spread||!S.spread.isCustom) return;
      if(!confirm('删除「'+S.spread.name+'」？')) return;
      S.custom=S.custom.filter(function(x){return x.id!==S.spread.id;});
      persistCustom();
      toast('已删除');
      S.screen='spreads'; S.spread=null; render();
    }
    else if(a==='saveImages'){
      var ta=document.getElementById('imgInput');
      if(!ta) return;
      var lines=ta.value.split('\n');
      var map={}; var cnt=0;
      lines.forEach(function(line){
        line=line.trim();
        if(!line) return;
        var parts=line.split(/\s+/);
        if(parts.length<2) return;
        var id=parts[0];
        var url=parts.slice(1).join(' ');
        map[id]=url; cnt++;
      });
      CARD_IMAGES=map;
      if(saveCardImages()) toast('✓ 已保存 '+cnt+' 张');
      else toast('存储空间不足');
      render();
    }
    else if(a==='clearImages'){
      if(!confirm('清空所有自定义图片？牌面会恢复为内置绘制。')) return;
      CARD_IMAGES={}; saveCardImages();
      toast('已清空'); render();
    }
  }catch(err){ console.error(err); toast('出错了'); }
});

function autoLayout(n){
  if(n===1) return [[50,50]];
  if(n===2) return [[30,50],[70,50]];
  if(n===3) return [[20,50],[50,50],[80,50]];
  if(n===4) return [[28,30],[72,30],[28,74],[72,74]];
  if(n===5) return [[50,14],[20,44],[80,44],[20,80],[80,80]];
  var pts=[];
  var cols = n<=6?3:(n<=8?4:(n<=9?3:4));
  var rows = Math.ceil(n/cols);
  for(var i=0;i<n;i++){
    var c=i%cols, r=Math.floor(i/cols);
    pts.push([ (c+0.5)/cols*84+8, (r+0.5)/rows*84+8 ]);
  }
  return pts;
}

/* ═══════════════════════════════════════════════
   抽牌（正逆位概率随机：每次抽牌在 20%~80% 之间浮动）
   ═══════════════════════════════════════════════ */
function startDraw(){
  var sp=S.spread;
  if(!sp) return;
  S.screen='drawing'; S.detailCard=null; render();
  setTimeout(function(){
    var deck=shuffle(S.deck);
    S.drawn=[];
    // 每次抽牌先随机一个整体逆位概率，范围 20%~80%
    var revProb = 0.2 + Math.random() * 0.6;
    for(var i=0;i<sp.positions.length;i++){
      S.drawn.push({
        card:deck[i],
        reversed: Math.random() < revProb,   // 每张牌独立按此概率判断逆位
        pos:sp.positions[i]
      });
    }
    S.screen='result'; render();
  },1400);
}

/* ═══════════════════════════════════════════════
   初始化
   ═══════════════════════════════════════════════ */
try{
  S.deck=buildDeck();
  S.custom=loadCustom();
  loadCardImages();
  render();
}catch(e){
  console.error(e);
  document.getElementById('app').innerHTML=
    '<div style="padding:60px 20px;text-align:center;color:#8A8177">'+
    '<div style="font-size:36px;margin-bottom:14px">✦</div>'+
    '<div>初始化失败：'+esc(e.message)+'</div></div>';
}
</script>
